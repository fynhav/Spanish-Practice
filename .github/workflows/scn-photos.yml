name: Scenario photos
# Downloads one photo per Scenarios word (public-domain / CC0 from Openverse, or Pixabay if a PIXABAY_KEY secret exists)
# and commits them to img/scn/. Runs once when this file or the search list changes, or by hand: Actions > Scenario photos > Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scn-photos.yml"
      - "tools/scn_queries.json"
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos (retries if the source rate-limits)
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          for i in 1 2 3 4 5 6; do
            python3 tools/scn_photos.py | tee out.txt
            grep -q "rate limit" out.txt || break
            sleep 240
          done
      - name: Commit photos
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          git add img
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add Scenarios photos"
          git pull --rebase
          git push
